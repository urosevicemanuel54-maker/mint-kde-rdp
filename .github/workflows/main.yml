name: Mint KDE desktop over RDP (Tailscale)

# Spins up a throwaway Linux desktop on a GitHub-hosted runner:
#   * Ubuntu 24.04 base (what Linux Mint is built on) + KDE Plasma + Mint's Mint-Y icons
#   * xrdp on port 3389, reachable ONLY through your Tailscale tailnet
#   * username / password login, so any RDP client works
#
# GitHub kills every job after 6 hours, so each run is a temporary machine.
# See README.md for the setup steps and the cost notes.

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: "How long to keep the desktop online, in minutes (max 330)"
        required: false
        default: "320"

  # Uncomment to have a desktop online around the clock: a run every 6 hours
  # replaces the one GitHub killed. On a private repo this bills ~340 minutes
  # per run, which eats the free 2000 minutes/month in under a week.
  # schedule:
  #   - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: mint-kde-rdp
  # A new run replaces the old desktop instead of waiting behind its 5.5 hour keep-alive.
  cancel-in-progress: true

jobs:
  desktop:
    name: KDE Plasma + xrdp + Tailscale
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    env:
      RDP_USER: ${{ secrets.RDP_USER || 'mint' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TS_HOSTNAME: ${{ secrets.TS_HOSTNAME || 'mint-kde' }}
      TS_TAG: ${{ secrets.TS_TAG || 'tag:ci' }}
      KEEP_ALIVE_MINUTES: ${{ github.event.inputs.keep_alive_minutes || '320' }}

    steps:
      - name: Check the required secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${RDP_PASSWORD}" ]; then
            echo "::error::Add a repository secret RDP_PASSWORD: the password for the desktop user."
            missing=1
          fi

          if [ -z "${TS_OAUTH_CLIENT_ID}" ] && [ -z "${TS_AUTHKEY}" ]; then
            echo "::error::Add either TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET (recommended), or TS_AUTHKEY."
            missing=1
          fi

          if [ -n "${TS_OAUTH_CLIENT_ID}" ] && [ -z "${TS_OAUTH_SECRET}" ]; then
            echo "::error::TS_OAUTH_CLIENT_ID is set but TS_OAUTH_SECRET is missing."
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          echo "Secrets look complete."

      - name: Connect to Tailscale
        # Runs before the desktop install, so a bad key fails in seconds instead of after
        # a ten-minute KDE download.
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail

          # Secrets pasted on a phone often carry a trailing newline or spaces, which the
          # control plane answers with "Status: 404, Message: not found".
          authkey="$(printf '%s' "${TS_AUTHKEY}" | tr -d '[:space:]')"
          client_id="$(printf '%s' "${TS_OAUTH_CLIENT_ID}" | tr -d '[:space:]')"
          client_secret="$(printf '%s' "${TS_OAUTH_SECRET}" | tr -d '[:space:]')"

          if [ -n "${authkey}" ]; then
            case "${authkey}" in
              tskey-auth-*) ;;
              *)
                echo "::error::TS_AUTHKEY does not look like an auth key: it must start with tskey-auth-. Copy the whole value from https://login.tailscale.com/admin/settings/keys"
                exit 1
                ;;
            esac
          elif [ -z "${client_id}" ] || [ -z "${client_secret}" ]; then
            echo "::error::Add TS_AUTHKEY, or TS_OAUTH_CLIENT_ID together with TS_OAUTH_SECRET."
            exit 1
          fi

          # Stop background apt timers so the Tailscale installer can take the apt lock.
          sudo systemctl stop --now unattended-upgrades.service apt-daily.timer \
            apt-daily-upgrade.timer 2>/dev/null || true

          curl -fsSL https://tailscale.com/install.sh | sh

          if ! sudo systemctl is-active --quiet tailscaled; then
            sudo systemctl status --no-pager tailscaled || true
            echo "::error::tailscaled did not start."
            exit 1
          fi
          sudo tailscale version

          up=(--hostname="${TS_HOSTNAME}" --accept-routes=false --timeout=120s)
          if [ -n "${authkey}" ]; then
            # Tags come from the key itself (tick Tags when generating it).
            up+=(--auth-key="${authkey}")
          else
            up+=(--client-id="${client_id}" --client-secret="${client_secret}" --advertise-tags="${TS_TAG}")
          fi

          if ! sudo tailscale up "${up[@]}"; then
            echo "::error::tailscale up failed. The auth key has probably expired, been revoked, already been used (a one-off key works only once), or was copied incompletely. Create a fresh key with Reusable and Ephemeral ticked at https://login.tailscale.com/admin/settings/keys and update the TS_AUTHKEY secret."
            exit 1
          fi

          sudo tailscale status | sed -n '1,20p'
          sudo tailscale ip -4

      - name: Free up disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/.ghcup /opt/Microsoft /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: Install KDE Plasma and xrdp
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kde-plasma-desktop \
            plasma-workspace \
            plasma-widgets-addons \
            kwin-x11 \
            kscreen \
            plasma-nm \
            plasma-pa \
            systemsettings \
            konsole \
            dolphin \
            kate \
            xrdp \
            xorgxrdp \
            ssl-cert \
            dbus-x11 \
            x11-xserver-utils \
            fonts-dejavu-core \
            fonts-noto-color-emoji
          sudo apt-get clean
          df -h /

      - name: Create the desktop user
        run: |
          set -euo pipefail

          if ! id -u "${RDP_USER}" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "${RDP_USER}"
          fi

          sudo usermod -aG sudo,ssl-cert "${RDP_USER}"
          printf '%s:%s\n' "${RDP_USER}" "${RDP_PASSWORD}" | sudo chpasswd

          echo "${RDP_USER} ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee "/etc/sudoers.d/90-${RDP_USER}" >/dev/null
          sudo chmod 0440 "/etc/sudoers.d/90-${RDP_USER}"

          # lets xrdp read its TLS key
          sudo adduser xrdp ssl-cert || true

      - name: Prepare the user's desktop settings
        run: |
          set -euo pipefail
          home="/home/${RDP_USER}"
          group="$(id -gn "${RDP_USER}")"
          sudo install -d -o "${RDP_USER}" -g "${group}" -m 0700 "${home}/.config"

          # No screen locker: it would ask for the password at every reconnect.
          printf '[Daemon]\nAutolock=false\nLockOnResume=false\n' \
            | sudo tee "${home}/.config/kscreenlockerrc" >/dev/null

          # No KDE Wallet prompt on login.
          printf '[Wallet]\nEnabled=false\nFirst Use=false\n' \
            | sudo tee "${home}/.config/kwalletrc" >/dev/null

          # Compositing off: far smoother over RDP. Drop this file for fancy effects.
          printf '[Compositing]\nEnabled=false\n' \
            | sudo tee "${home}/.config/kwinrc" >/dev/null

          sudo chown -R "${RDP_USER}:${group}" "${home}/.config"

      - name: Add the Linux Mint look
        continue-on-error: true
        run: |
          set -euo pipefail

          # Cosmetic only: if the icon set cannot be fetched, keep going.
          tmp="$(mktemp -d)"
          if git clone --depth 1 https://github.com/linuxmint/mint-y-icons.git "${tmp}/icons"; then
            sudo cp -r "${tmp}/icons/usr/share/icons/." /usr/share/icons/
            sudo gtk-update-icon-cache -f -t /usr/share/icons/Mint-Y || true

            # Select the theme in the user's KDE config (written before the first login).
            printf '[Icons]\nTheme=Mint-Y\n' \
              | sudo tee "/home/${RDP_USER}/.config/kdeglobals" >/dev/null
            sudo chown "${RDP_USER}:$(id -gn "${RDP_USER}")" \
              "/home/${RDP_USER}/.config/kdeglobals"
          else
            echo "::warning::Could not fetch the Mint-Y icon theme; continuing with KDE's default icons."
          fi

      - name: Configure xrdp to start KDE Plasma
        run: |
          set -euo pipefail

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'STARTWM'
          #!/bin/bash
          # Session started by xrdp on every RDP login.
          if [ -r /etc/profile ]; then . /etc/profile; fi
          if [ -f "$HOME/.profile" ]; then . "$HOME/.profile"; fi

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=KDE
          export XDG_SESSION_DESKTOP=KDE
          export DESKTOP_SESSION=plasma
          export XDG_RUNTIME_DIR="/tmp/xrdp-runtime-$USER"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          exec dbus-run-session -- startplasma-x11
          STARTWM

          sudo chmod 0755 /etc/xrdp/startwm.sh

          command -v startplasma-x11 >/dev/null \
            || echo "::warning::startplasma-x11 is missing, Plasma will not start over RDP"

          # xrdp dies without a word when its runtime directories or the snakeoil TLS key are
          # missing: a package installed into an already-booted machine never got them from
          # boot-time tmpfiles, and then nothing is listening on 3389.
          sudo systemd-tmpfiles --create 2>/dev/null || true
          sudo install -d -o xrdp -g xrdp -m 0755 /run/xrdp /var/log/xrdp /var/lib/xrdp
          if [ ! -s /etc/ssl/private/ssl-cert-snakeoil.key ]; then
            sudo make-ssl-cert generate-default-snakeoil --force-overwrite || true
          fi
          sudo adduser xrdp ssl-cert || true
          grep -E '^(port|address)=' /etc/xrdp/xrdp.ini || true

          sudo systemctl daemon-reload
          sudo systemctl enable xrdp-sesman >/dev/null 2>&1 || true
          sudo systemctl enable xrdp >/dev/null 2>&1 || true
          sudo systemctl restart xrdp-sesman 2>/dev/null || true
          sudo systemctl restart xrdp

          # "systemctl is-active" reports active for SysV-wrapped units even after the daemon
          # has exited, so wait for the port itself instead of trusting the unit.
          for _ in $(seq 1 30); do
            if ss -ltn 2>/dev/null | grep ':3389' >/dev/null; then
              break
            fi
            sleep 2
          done

          if ! ss -ltn 2>/dev/null | grep ':3389' >/dev/null; then
            echo "--- systemctl status xrdp ---"
            sudo systemctl status xrdp --no-pager || true
            echo "--- recent logs ---"
            sudo journalctl -u xrdp -u xrdp-sesman -n 40 --no-pager || true
            sudo tail -n 40 /var/log/xrdp.log 2>/dev/null || echo "(no /var/log/xrdp.log)"

            echo "::warning::xrdp did not start through systemctl, starting the daemon directly"
            sudo systemd-run --unit=xrdp-fallback --collect /usr/sbin/xrdp --nodaemon || true
            for _ in $(seq 1 15); do
              if ss -ltn 2>/dev/null | grep ':3389' >/dev/null; then
                break
              fi
              sleep 2
            done
          fi

          if ! ss -ltn 2>/dev/null | grep ':3389' >/dev/null; then
            sudo journalctl -u xrdp-fallback -n 40 --no-pager || true
            echo "::error::xrdp is not listening on port 3389, so no RDP client can connect. The logs above say why."
            exit 1
          fi

          ss -ltn | grep ':3389'

      - name: Show how to connect
        run: |
          set -euo pipefail
          TS_IP="$(sudo tailscale ip -4 2>/dev/null | sed -n '1p' || true)"
          TS_NAME="$(sudo tailscale status --json 2>/dev/null | jq -r '.Self.DNSName' 2>/dev/null | sed 's/\.$//' || true)"

          if [ -z "${TS_IP}" ]; then
            echo "::warning::Could not read the Tailscale address, check the 'Connect to Tailscale' step."
          fi
          ss -ltn | grep ':3389' || echo "::warning::Nothing is listening on port 3389"
          {
            echo "## Your desktop is online"
            echo ""
            echo "- **Address:** \`${TS_NAME:-$TS_IP}\`"
            echo "- **Tailscale IP:** \`${TS_IP}\`"
            echo "- **Port:** \`3389\`"
            echo "- **Username:** \`${RDP_USER}\`"
            echo "- **Password:** the value of the RDP_PASSWORD secret"
            echo ""
            echo "Only devices signed in to your tailnet can reach this machine."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the desktop online
        run: |
          set -euo pipefail
          minutes="${KEEP_ALIVE_MINUTES}"

          if ! [[ "${minutes}" =~ ^[0-9]+$ ]]; then
            echo "keep_alive_minutes must be a whole number of minutes."
            exit 1
          fi

          if [ "${minutes}" -gt 330 ]; then
            echo "Clamping keep-alive time to 330 minutes (GitHub stops a job at 6 hours)."
            minutes=330
          fi

          deadline=$(( $(date +%s) + minutes * 60 ))
          echo "Desktop will stay online for ${minutes} minutes."

          while [ "$(date +%s)" -lt "${deadline}" ]; do
            left=$(( deadline - $(date +%s) ))
            step=$(( left < 600 ? left : 600 ))
            if [ "${step}" -gt 0 ]; then
              sleep "${step}"
            fi

            if ! ss -ltn 2>/dev/null | grep ':3389' >/dev/null; then
              echo "xrdp stopped listening, restarting it"
              sudo systemctl restart xrdp || true
            fi

            echo "Still online, $(( left / 60 )) minute(s) left"
          done

          echo "Keep-alive finished, the runner will be destroyed."

      - name: Disconnect from Tailscale
        # Logging out removes the ephemeral node from the tailnet immediately, so the next run
        # gets the plain hostname back instead of mint-kde-2, -3, ...
        if: always()
        run: |
          sudo tailscale logout || true
          echo "Removed this run's node from the tailnet."
