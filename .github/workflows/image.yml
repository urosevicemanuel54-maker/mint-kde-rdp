name: Build desktop image

# Bakes KDE Plasma + xrdp into a container image and pushes it to GitHub Container Registry.
# Run this once (and again whenever docker/ changes); then the "prebuilt image" workflow starts a
# desktop in about a minute instead of installing everything from scratch.

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/**"
      - ".github/workflows/image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-desktop-image
  cancel-in-progress: true

jobs:
  build:
    name: Build and push ghcr.io image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
